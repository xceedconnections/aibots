; Vendor-style AI carrier dialplan
; VICIdial only dials SIP — session start is INTERNAL (Asterisk → API).
;
; AudioSocket(uuid,service) — UUID MUST be a standard UUID string.
; Do NOT use SHELL() — often blocked when live_dangerously=no (empty UUID → no AI audio).

[from-vicidial]
exten => _X.,1,NoOp(AIBOTS SIP call exten=${EXTEN} channel=${CHANNEL})
 same => n,Answer()
 same => n,Wait(0.2)
 same => n,Set(TIMEOUT(absolute)=900)
 ; UUID from API (reliable). MD5 fallback if CURL empty.
 same => n,Set(CURLOPT(httptimeout)=5)
 same => n,Set(ASUUID=${CURL(http://api:8000/internal/sip/new-uuid)})
 same => n,Set(ASUUID=${FILTER(0123456789abcdefABCDEF-,${ASUUID})})
 same => n,GotoIf($["${LEN(${ASUUID})}" = "36"]?haveuuid)
 same => n,NoOp(AIBOTS UUID via CURL failed, using MD5 fallback)
 same => n,Set(H=${MD5(${UNIQUEID}-${EPOCH}-${RAND(100000,999999)})})
 same => n,Set(ASUUID=${H:0:8}-${H:8:4}-${H:12:4}-${H:16:4}-${H:20:12})
 same => n(haveuuid),NoOp(AIBOTS AudioSocket UUID=${ASUUID})
 same => n,Set(CALLER=${CALLERID(num)})
 same => n,Set(LEAD_ID=${PJSIP_HEADER(read,X-VICIdial-Lead-Id)})
 same => n,Set(PHONE=${PJSIP_HEADER(read,X-VICIdial-Caller-Id)})
 same => n,Set(CLIENT_ID=${PJSIP_HEADER(read,X-VICIdial-Client-Id)})
 same => n,Set(USER_ID=${PJSIP_HEADER(read,X-VICIdial-User-Id)})
 same => n,Set(CAMPAIGN=${PJSIP_HEADER(read,X-VICIdial-Campaign-Id)})
 same => n,ExecIf($["${PHONE}" = ""]?Set(PHONE=${CALLER}))
 same => n,NoOp(AIBOTS headers lead=${LEAD_ID} phone=${PHONE} client=${CLIENT_ID} user=${USER_ID} camp=${CAMPAIGN})
 same => n,Set(CURLOPT(httptimeout)=8)
 same => n,Set(START_URL=http://api:8000/internal/sip/call-start)
 same => n,Set(QS=?call_id=${ASUUID}&uniqueid=${ASUUID}&simulate=false)
 same => n,Set(QS=${QS}&lead_id=${LEAD_ID}&phone=${PHONE}&campaign=${CAMPAIGN})
 same => n,Set(QS=${QS}&client_id=${CLIENT_ID}&user_id=${USER_ID}&remote_agent=${USER_ID})
 same => n,Set(CURL_RESULT=${CURL(${START_URL}${QS})})
 same => n,NoOp(AIBOTS call-start: ${CURL_RESULT})
 same => n,GotoIf($["${CURL_RESULT}" != ""]?audio)
 same => n,Wait(0.5)
 same => n,Set(CURL_RESULT=${CURL(${START_URL}${QS})})
 same => n,NoOp(AIBOTS call-start retry: ${CURL_RESULT})
 ; Brief beep proves dialplan audio path before AI bridge
 same => n(audio),Playback(beep)
 same => n,NoOp(AIBOTS bridging AudioSocket(${ASUUID},worker:9092))
 same => n,AudioSocket(${ASUUID},worker:9092)
 same => n,NoOp(AIBOTS AudioSocket finished)
 same => n,Set(XFER_DID=${CURL(http://api:8000/internal/sip/${ASUUID}/xfer)})
 same => n,GotoIf($["${XFER_DID}" != ""]?dotransfer)
 same => n,Hangup()
 same => n(dotransfer),NoOp(AIBOTS transfer DID ${XFER_DID})
 same => n,Dial(PJSIP/${XFER_DID}@vicidial-out,60,tT)
 same => n,Hangup()

exten => s,1,Goto(from-vicidial,9999,1)

[aibots-transfer]
exten => _X.,1,NoOp(Transfer to DID ${EXTEN})
 same => n,Dial(PJSIP/${EXTEN}@vicidial-out,60,tT)
 same => n,Hangup()

[from-internal]
exten => _X.,1,Hangup()
