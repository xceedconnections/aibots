; Transport — UDP 5060 for VICIdial carrier (IP-based, no registration)
[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060
external_media_address=PUBLIC_IP
external_signaling_address=PUBLIC_IP
local_net=10.0.0.0/8
local_net=172.16.0.0/12
local_net=192.168.0.0/16

; Inbound from VICIdial — identified by source IP only (no SIP register)
[vicidial]
type=endpoint
context=from-vicidial
disallow=all
allow=ulaw
allow=alaw
aors=vicidial
identify_by=ip
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
dtmf_mode=rfc4733
from_domain=PUBLIC_IP
allow_unauthenticated_options=yes

[vicidial]
type=aor
max_contacts=0

; match= lines live in /etc/asterisk/pjsip_identify.conf (portal updates)
#include pjsip_identify.conf

; Default outbound trunk (seed / first Vicidial) — DID transfer return path
[vicidial-out]
type=endpoint
context=from-internal
disallow=all
allow=ulaw
allow=alaw
aors=vicidial-out
identify_by=ip
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
from_user=aibots
from_domain=PUBLIC_IP

[vicidial-out]
type=aor
contact=sip:VICIDIAL_IP:5060
