; AIBOTS PJSIP — IP trunk from VICIdial (NO SIP auth challenge)
; Vicibox must use insecure=port,invite and NO username/secret on [aibots]

[global]
type=global
; Prefer IP identify, then anonymous so INVITEs are never 401'd for missing auth
endpoint_identifier_order=ip,anonymous,username,header

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060
external_media_address=PUBLIC_IP
external_signaling_address=PUBLIC_IP
local_net=10.0.0.0/8
local_net=172.16.0.0/12
local_net=192.168.0.0/16

; -------- Inbound AI carrier (from Vicidial) --------
[vicidial]
type=endpoint
context=from-vicidial
disallow=all
allow=ulaw
allow=alaw
aors=vicidial
identify_by=ip
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
dtmf_mode=rfc4733
from_domain=PUBLIC_IP
allow_unauthenticated_options=yes
; Intentionally NO auth= / outbound_auth= (IP trunk)

[vicidial]
type=aor
max_contacts=0

; Catch-all identify (firewall allow-list is the real ACL)
#include pjsip_identify.conf

; Fallback if identify somehow misses — still enter AI dialplan, never 401
[anonymous]
type=endpoint
context=from-vicidial
disallow=all
allow=ulaw
allow=alaw
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
dtmf_mode=rfc4733
allow_unauthenticated_options=yes

; -------- Outbound transfer back to Vicidial DIDs --------
[vicidial-out]
type=endpoint
context=from-internal
disallow=all
allow=ulaw
allow=alaw
aors=vicidial-out
identify_by=ip
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
from_user=aibots
from_domain=PUBLIC_IP

[vicidial-out]
type=aor
contact=sip:VICIDIAL_IP:5060
